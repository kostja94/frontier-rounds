name: Deploy Frontier Rounds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 用 npm install（非 ci）：package.json 已在 Windows 生成过 lock，
      # Linux runner 上改由 npm 解析本平台依赖后安装
      - run: npm install --no-audit --no-fund

      # 内容 JSON 完整性闸门（slug 唯一/logo 磁盘存在/lead 关联 profile/tier 枚举）
      - run: npm run validate:content

      # OpenNext 构建 + wrangler 部署到 Cloudflare Workers
      - name: Build & deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
